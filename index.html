<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="description" content="CampusConnect helps students check faculty availability, book consultations and track appointment requests. A university prototype."><title>CampusConnect</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0f2547',navy2:'#1b3a6b',teal:'#0d9488'}}}}</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{background:#f4f6fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b}header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0f2547;z-index:30}input,select,textarea{border:1px solid #cbd5e1;border-radius:.75rem;padding:.6rem .8rem;width:100%;background:#fff;font-size:.875rem}input:focus,select:focus,textarea:focus{outline:2px solid #0d9488;border-color:transparent}</style></head>
<body><div id="root"></div>
<script>
const {useState}=React,html=htm.bind(React.createElement);
const K='cc_v1',DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ST=['Available','Busy','Unavailable'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>new Date(s+'T00:00:00').getDay();
const dl=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const H=(a,d=[1,2,3,4,5])=>Object.fromEntries(d.map(x=>[x,a]));
const A1=['10:00','11:00','14:00','15:00'],B1=['09:00','10:00','13:00'],C1=['11:00','12:00','16:00'];
const cx=(...a)=>a.filter(Boolean).join(' ');
const P={search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',cap:'<path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
const Ic=({n,c='h-4 w-4'})=>html`<svg class=${c} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" dangerouslySetInnerHTML=${{__html:P[n]}}/>`;
const seed=()=>{
const f=(id,name,dept,desig,subj,cabin,status,msg,h)=>({id,name,dept,desig,subj,cabin,status,msg,upd:Date.now()-(+id.slice(1))*54e5,hours:h});
const ap=(id,fid,status,date,time,mode,subject,doubt,student='Demo Student')=>({id,fid,student,date,time,mode,subject,doubt,status,alt:null,at:Date.now()-6e5});
const n=(to,text,m)=>({id:Math.random().toString(36).slice(2),to,text,ts:Date.now()-m*6e4});
const CS='Computer Science',EC='Electronics & Communication',MS='Mathematics & Sciences';
return{user:null,
faculty:[f('f1','Dr. Meera Iyer',CS,'Associate Professor',['Data Structures','Algorithms'],'Block A, Cabin 312','Available','In my cabin, walk-ins welcome until 4 PM',H(A1)),
f('f2','Prof. Rohan Malhotra',CS,'Assistant Professor',['Operating Systems','Cyber Security'],'Block A, Cabin 305','Busy','In a lab session until 1 PM',H(B1,[1,3,5])),
f('f3','Dr. Anurav Verma',CS,'Professor',['Machine Learning','Python'],'Block A, Cabin 220','Unavailable','At a conference this week',H(C1,[2,4])),
f('f4','Dr. Anita Deshmukh',EC,'Professor',['Digital Electronics','Embedded Systems'],'Block B, Cabin 118','Available','Open for project discussions',H(B1)),
f('f5','Prof. Karthik Nair',EC,'Assistant Professor',['Signals & Systems','Microprocessors'],'Block B, Cabin 124','On Leave','On leave until next Monday',H(A1,[1,2,3])),
f('f6','Dr. Priya Kulkarni',MS,'Associate Professor',['Linear Algebra','Probability'],'Block C, Cabin 402','Available','Doubt-clearing session open',H(C1)),
f('f7','Prof. Imran Qureshi',MS,'Assistant Professor',['Engineering Physics','Calculus'],'Block C, Cabin 410','Busy','Evaluating answer sheets',H(A1,[2,3,4])),
f('f8','Dr. Neha Bansal',MS,'Professor',['Discrete Mathematics','Statistics'],'Block C, Cabin 398','Available','Happy to help with problem sets',H(B1,[1,2,4]))],
appts:[ap('CC-1001','f1','Confirmed',addD(2),'10:00','In-person','Data Structures','Clarify AVL tree rotations'),
ap('CC-1002','f4','Pending',addD(3),'13:00','Online','Digital Electronics','Need help with flip-flop timing diagrams'),
ap('CC-1003','f6','Completed',addD(-3),'11:00','In-person','Probability','Bayes theorem examples'),
ap('CC-1004','f1','Pending',addD(1),'11:00','In-person','Algorithms','Dynamic programming recurrence for knapsack','Riya Singh'),
ap('CC-1005','f1','Pending',addD(1),'15:00','Online','Data Structures','Hash table collision handling','Kabir Mehta'),
ap('CC-1006','f1','Confirmed',addD(0),'14:00','In-person','Algorithms','Graph traversal assignment doubt','Ananya Das')],
notifs:[n('student','Your request CC-1002 is awaiting a response from Dr. Anita Deshmukh.',30),n('student','Dr. Meera Iyer confirmed appointment CC-1001.',180),n('f1','New request CC-1004 from Riya Singh.',45),n('f1','New request CC-1005 from Kabir Mehta.',20)]}};
const load=()=>{try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.faculty)return s}catch(e){}return seed()};
const note=(n,to,text)=>n.notifs.unshift({id:Math.random().toString(36).slice(2),to,text,ts:Date.now()});
const taken=(S,fid,d,t)=>S.appts.some(a=>a.fid===fid&&a.date===d&&a.time===t&&['Pending','Confirmed'].includes(a.status));
const free=(S,f,d)=>(f.hours[wd(d)]||[]).filter(t=>!taken(S,f.id,d,t)&&(d>addD(0)||(d===addD(0)&&t>nowT())));
const nextSlot=(S,f)=>{for(let i=0;i<21;i++){const d=addD(i),s=free(S,f,d);if(s.length)return{d,t:s[0]}}return null};
const fof=(S,id)=>S.faculty.find(f=>f.id===id);
const SC={Available:['bg-emerald-100 text-emerald-700','bg-emerald-500'],Busy:['bg-amber-100 text-amber-700','bg-amber-500'],Unavailable:['bg-red-100 text-red-700','bg-red-500'],'On Leave':['bg-slate-200 text-slate-600','bg-slate-400']};
const AC={Pending:'bg-amber-100 text-amber-700',Confirmed:'bg-emerald-100 text-emerald-700',Rejected:'bg-red-100 text-red-700',Completed:'bg-blue-100 text-blue-700',Cancelled:'bg-slate-200 text-slate-600'};
const Badge=({s})=>html`<span class=${'inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold '+SC[s][0]}><i class=${'h-2 w-2 rounded-full '+SC[s][1]}></i>${s}</span>`;
const Pill=({s})=>html`<span class=${'rounded-full px-2.5 py-1 text-xs font-semibold '+AC[s]}>${s}</span>`;
const Bt=({k='p',c='',...r})=>html`<button class=${cx('inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition disabled:opacity-50',{p:'bg-navy text-white hover:bg-navy2',t:'bg-teal text-white hover:opacity-90',g:'border border-slate-300 bg-white text-slate-700 hover:bg-slate-50',r:'bg-red-600 text-white hover:bg-red-700'}[k],c)} ...${r}/>`;
const Cd=({c='',children})=>html`<div class=${'rounded-2xl border border-slate-200 bg-white p-5 shadow-sm '+c}>${children}</div>`;
const Sec=({t,children,right})=>html`<${Cd}><div class="mb-3 flex items-center justify-between"><h2 class="font-semibold text-navy">${t}</h2>${right}</div>${children}<//>`;
const Em=({t})=>html`<p class="rounded-xl bg-slate-50 p-4 text-center text-sm text-slate-500">${t}</p>`;
const Av=({n})=>html`<div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-navy text-sm font-bold text-white">${n.replace(/^(Dr|Prof)\.\s*/,'').split(' ').map(w=>w[0]).join('')}</div>`;
const Notifs=({A,to})=>{const l=A.S.notifs.filter(n=>n.to===to).slice(0,5);return l.length?html`<ul class="space-y-2">${l.map(n=>html`<li key=${n.id} class="flex gap-3 rounded-xl bg-slate-50 p-3 text-sm"><${Ic} n="bell" c="mt-0.5 h-4 w-4 shrink-0 text-teal"/><div><p>${n.text}</p><p class="text-xs text-slate-400">${ago(n.ts)}</p></div></li>`)}</ul>`:html`<${Em} t="No notifications yet."/>`};
function Nav({A,p}){const u=A.S.user,{go}=A;
const L=u?(u.role==='student'?[['dash','Dashboard','home'],['dir','Find Faculty','users'],['track','My Appointments','list'],['faq','FAQ','help']]:[['dash','Dashboard','home'],['dir','Directory','users'],['faq','FAQ','help']]):[['landing','Home','home'],['dir','Find Faculty','users'],['faq','FAQ','help']];
return html`<header class="bg-navy text-white shadow"><div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3"><button onClick=${()=>go(u?'dash':'landing')} class="flex items-center gap-2 text-lg font-bold"><${Ic} n="cap" c="h-6 w-6 text-teal"/>CampusConnect</button>
<nav class="hidden items-center gap-1 md:flex">${L.map(([k,t])=>html`<button key=${k} onClick=${()=>go(k)} class=${cx('rounded-lg px-3 py-2 text-sm transition',p===k?'bg-white/15':'hover:bg-white/10')}>${t}</button>`)}</nav>
<div class="flex items-center gap-2">${u?html`<span class="hidden rounded-full bg-white/10 px-3 py-1 text-xs capitalize sm:inline">${u.role} demo</span><button onClick=${A.logout} class="flex items-center gap-1 rounded-lg bg-white/10 px-3 py-2 text-sm hover:bg-white/20"><${Ic} n="out"/>Log out</button>`:html`<button onClick=${()=>go('login')} class="rounded-lg bg-teal px-4 py-2 text-sm font-semibold hover:opacity-90">Log in</button>`}</div></div>
<nav class="flex gap-1 overflow-x-auto px-3 pb-2 md:hidden">${L.map(([k,t])=>html`<button key=${k} onClick=${()=>go(k)} class=${cx('shrink-0 rounded-lg px-3 py-1.5 text-sm',p===k?'bg-white/15':'')}>${t}</button>`)}</nav></header>`}

function Landing({A}){const {S,go}=A;
const steps=[['Search','Find your faculty by name, subject or department.'],['Book','Pick a free slot and describe your doubt.'],['Meet','Get a confirmation and meet at the right time.']];
const feats=[['clock','Check Faculty Availability','See live status and next consultation time before you walk to a cabin.'],['cal','Book Consultations','Reserve a slot in-person or online, with conflicts prevented automatically.'],['list','Track Your Requests','Follow every request from pending to confirmed with instant updates.']];
return html`<div>
<section class="bg-navy text-white"><div class="mx-auto grid max-w-6xl items-center gap-10 px-4 py-14 md:grid-cols-2"><div><p class="mb-3 text-sm font-semibold uppercase tracking-wider text-teal">Your Faculty. Their Availability. Your Time.</p><h1 class="text-4xl font-bold leading-tight md:text-5xl">Never Miss the Right Time to Meet Your Faculty.</h1><p class="mt-4 max-w-lg text-slate-300">CampusConnect shows when professors are available, lets you book consultations for academic doubts, and keeps you updated on every request.</p><div class="mt-7 flex flex-wrap gap-3"><${Bt} k="t" c="px-6" onClick=${()=>go('dir')}><${Ic} n="search"/>Find Faculty<//><${Bt} k="g" onClick=${()=>go('login')}>Try the demo<//></div></div>
<div class="rounded-2xl bg-white p-4 text-slate-800 shadow-xl"><p class="mb-3 text-sm font-semibold text-navy">Faculty dashboard preview</p><div class="space-y-2">${S.faculty.slice(0,4).map(f=>html`<div key=${f.id} class="flex items-center gap-3 rounded-xl bg-slate-50 p-3"><${Av} n=${f.name}/><div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold">${f.name}</p><p class="truncate text-xs text-slate-500">${f.msg}</p></div><${Badge} s=${f.status}/></div>`)}</div></div></div></section>
<section class="mx-auto max-w-6xl px-4 py-14"><h2 class="mb-8 text-center text-2xl font-bold text-navy">How It Works</h2><div class="grid gap-4 md:grid-cols-3">${steps.map(([t,d],i)=>html`<${Cd} key=${t}><div class="mb-3 flex h-9 w-9 items-center justify-center rounded-full bg-teal font-bold text-white">${i+1}</div><h3 class="font-semibold text-navy">${t}</h3><p class="mt-1 text-sm text-slate-500">${d}</p><//>`)}</div>
<div class="mt-8 grid gap-4 md:grid-cols-3">${feats.map(([i,t,d])=>html`<${Cd} key=${t}><div class="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-teal/10 text-teal"><${Ic} n=${i} c="h-5 w-5"/></div><h3 class="font-semibold text-navy">${t}</h3><p class="mt-1 text-sm text-slate-500">${d}</p><//>`)}</div></section>
<footer class="bg-navy py-8 text-center text-sm text-slate-300"><p class="font-semibold text-white">CampusConnect</p><p>Design Thinking prototype. All faculty and data are fictional.</p></footer></div>`}

function Login({A,v}){const [u,setU]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[ld,setLd]=useState(false);
const submit=e=>{e&&e.preventDefault();const r=u==='student'&&pw==='student123'?'student':u==='faculty'&&pw==='faculty123'?'faculty':null;if(!r)return setErr('Invalid username or password.');setErr('');setLd(true);setTimeout(()=>{A.login(r,v.next,v.fid)},500)};
const D=[['student','Student Demo','student123','Search faculty, book and track appointments.'],['faculty','Faculty Demo','faculty123','Manage availability and respond to requests.']];
return html`<div class="mx-auto max-w-3xl"><h1 class="mb-1 text-2xl font-bold text-navy">Log in to CampusConnect</h1><p class="mb-5 text-slate-500">Choose a demo role or enter the credentials.</p>
<div class="mb-5 grid gap-4 sm:grid-cols-2">${D.map(([n,t,p,d])=>html`<${Cd} key=${n}><h3 class="font-semibold text-navy">${t}</h3><p class="text-sm text-slate-500">${d}</p><p class="mt-2 text-xs text-slate-500">Username: <b>${n}</b> / Password: <b>${p}</b></p><${Bt} k="g" c="mt-3 w-full" onClick=${()=>{setU(n);setPw(p);setErr('')}}>Use ${n} credentials<//><//>`)}</div>
<${Cd}><form onSubmit=${submit} class="space-y-3"><input placeholder="Username" value=${u} onInput=${e=>setU(e.target.value)}/><input type="password" placeholder="Password" value=${pw} onInput=${e=>setPw(e.target.value)}/>${err&&html`<p class="text-sm text-red-600">${err}</p>`}<${Bt} k="t" c="w-full" disabled=${ld} type="submit">${ld?'Signing in...':'Log in'}<//></form><//></div>`}
  function FCard({f,A}){const {S,go,book}=A,ns=nextSlot(S,f);
return html`<${Cd} c="flex flex-col gap-3"><div class="flex items-start gap-3"><${Av} n=${f.name}/><div class="min-w-0 flex-1"><h3 class="font-semibold text-navy">${f.name}</h3><p class="text-xs text-slate-500">${f.dept}</p></div><${Badge} s=${f.status}/></div>
<div class="flex flex-wrap gap-1.5">${f.subj.map(s=>html`<span key=${s} class="rounded-md bg-slate-100 px-2 py-1 text-xs text-slate-600">${s}</span>`)}</div>
<p class="flex items-center gap-1.5 text-sm text-slate-600"><${Ic} n="clock" c="h-4 w-4 text-teal"/>Next: ${ns?dl(ns.d)+', '+ns.t:'No slots soon'}</p>
<div class="mt-auto flex gap-2"><${Bt} k="g" c="flex-1" onClick=${()=>go('profile',{fid:f.id})}>View Profile<//><${Bt} c="flex-1" onClick=${()=>book(f.id)}>Book Appointment<//></div><//>`}

function Dir({A,v}){const {S}=A,[q,setQ]=useState(v.q||''),[d,setD]=useState(''),[s,setS]=useState(''),[st,setSt]=useState('');
const depts=[...new Set(S.faculty.map(f=>f.dept))],subs=[...new Set(S.faculty.flatMap(f=>f.subj))].sort();
const L=S.faculty.filter(f=>(!q||(f.name+' '+f.subj.join(' ')+f.dept).toLowerCase().includes(q.toLowerCase()))&&(!d||f.dept===d)&&(!s||f.subj.includes(s))&&(!st||f.status===st));
return html`<div><h1 class="mb-4 text-2xl font-bold text-navy">Faculty Directory</h1><div class="mb-5 grid gap-3 md:grid-cols-4"><input placeholder="Search name or subject" value=${q} onInput=${e=>setQ(e.target.value)}/><select value=${d} onChange=${e=>setD(e.target.value)}><option value="">All departments</option>${depts.map(x=>html`<option key=${x}>${x}</option>`)}</select><select value=${s} onChange=${e=>setS(e.target.value)}><option value="">All subjects</option>${subs.map(x=>html`<option key=${x}>${x}</option>`)}</select><select value=${st} onChange=${e=>setSt(e.target.value)}><option value="">All statuses</option>${[...ST,'On Leave'].map(x=>html`<option key=${x}>${x}</option>`)}</select></div>
${L.length?html`<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">${L.map(f=>html`<${FCard} key=${f.id} f=${f} A=${A}/>`)}</div>`:html`<${Em} t="No faculty match your filters. Try clearing a filter."/>`}</div>`}

function Profile({A,v}){const {S,go,book}=A,f=fof(S,v.fid);
const days=[...Array(10).keys()].map(i=>addD(i)).map(d=>[d,free(S,f,d)]).filter(x=>x[1].length).slice(0,5);
return html`<div class="space-y-5"><${Bt} k="g" onClick=${()=>go('dir')}>Back to directory<//>
<${Cd} c="flex flex-wrap items-start gap-4"><${Av} n=${f.name}/><div class="min-w-0 flex-1"><h1 class="text-2xl font-bold text-navy">${f.name}</h1><p class="text-slate-500">${f.desig}, ${f.dept}</p><p class="mt-2 flex items-center gap-1.5 text-sm"><${Ic} n="pin" c="h-4 w-4 text-teal"/>${f.cabin}</p><div class="mt-2 flex flex-wrap gap-1.5">${f.subj.map(s=>html`<span key=${s} class="rounded-md bg-slate-100 px-2 py-1 text-xs">${s}</span>`)}</div></div><div class="text-right"><${Badge} s=${f.status}/><p class="mt-2 max-w-xs text-sm text-slate-600">${f.msg}</p><p class="text-xs text-slate-400">Updated ${ago(f.upd)}</p></div><//>
<div class="grid gap-5 md:grid-cols-2"><${Sec} t="Consultation hours">${[1,2,3,4,5].map(d=>html`<div key=${d} class="flex justify-between border-b border-slate-100 py-2 text-sm last:border-0"><span class="font-medium">${DN[d]}</span><span class="text-slate-600">${(f.hours[d]||[]).join(', ')||'Not available'}</span></div>`)}<//>
<${Sec} t="Available appointment slots">${days.length?days.map(([d,sl])=>html`<div key=${d} class="mb-3"><p class="mb-1 text-xs font-semibold text-slate-500">${dl(d)}</p><div class="flex flex-wrap gap-2">${sl.map(t=>html`<button key=${t} onClick=${()=>book(f.id,d,t)} class="rounded-lg border border-teal px-3 py-1.5 text-sm text-teal hover:bg-teal hover:text-white">${t}</button>`)}</div></div>`):html`<${Em} t="No open slots in the next 10 days."/>`}<//></div>
<${Bt} k="t" c="w-full py-3 text-base" onClick=${()=>book(f.id)}><${Ic} n="cal"/>Book Appointment<//></div>`}
  function Book({A,v}){const {S,save,go,toast}=A,[fid,setF]=useState(v.fid||''),[date,setDate]=useState(v.date||''),[time,setT]=useState(v.time||''),[mode,setM]=useState('In-person'),[sub,setSub]=useState(''),[doubt,setDb]=useState(''),[done,setDone]=useState(null),[ld,setLd]=useState(false);
const [step,setStep]=useState(v.fid&&v.date&&v.time?3:v.fid?2:1);
const f=fid&&fof(S,fid),slots=f&&date?free(S,f,date):[];
const next=()=>{if(step===1&&!fid)return toast('Choose a faculty member.');if(step===2&&(!date||!time))return toast('Select a date and an available slot.');if(step===3&&(!sub.trim()||doubt.trim().length<10))return toast('Enter a subject and describe your doubt (10+ characters).');setStep(step+1)};
const submit=()=>{if(taken(S,fid,date,time)){setStep(2);return toast('That slot was just taken. Please choose another.')}setLd(true);setTimeout(()=>{const id='CC-'+Date.now().toString(36).toUpperCase().slice(-6);save(n=>{n.appts.unshift({id,fid,student:'Demo Student',date,time,mode,subject:sub.trim(),doubt:doubt.trim(),status:'Pending',alt:null,at:Date.now()});note(n,fid,'New request '+id+' from Demo Student: '+sub.trim());note(n,'student','Request '+id+' sent to '+f.name+'. Status: Pending.')});setLd(false);setDone(id)},600)};

  const FQ=[['How do I submit an assignment?','Log in to your university LMS, open the course page, choose the assignment and upload your file before the deadline.'],['Where can I find lecture notes?','Lecture notes are posted in the course section of the LMS under Resources. Some faculty also share them during class.'],['When is the next internal assessment?','Internal assessment dates are listed in the academic calendar and announced by each course faculty on the LMS.'],['How do I contact my faculty?','Use CampusConnect to check availability and book a consultation, or write to them via the official university mail.'],['How do I book a consultation?','Open Find Faculty, pick a faculty member, choose a free slot, add your doubt and submit. You will be notified once they respond.'],['What if my appointment is rejected?','Book another slot from the faculty profile. Faculty may also suggest an alternative time that you can accept.'],['Can I cancel an appointment?','Yes. Open My Appointments and cancel any pending or confirmed request.'],['What does faculty status mean?','Available means free for walk-ins, Busy means occupied, Unavailable means out of cabin, On Leave means away from campus.']];
